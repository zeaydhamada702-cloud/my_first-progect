<!DOCTYPE html>
<html>
<head>
    <title>مشروعي الأول</title>
    <style>
        /* خلفية الصفحة ونوع الخط */
        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }

        /* تنسيق العنوان الرئيسي */
        h1 {
            color: #2c3e50;
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            font-size: 28px;
        }

        /* تنسيق الصورة الدائرية */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 20px auto;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        /* تنسيق النص التعريفي */
        .bio-text {
            color: #555555;
            font-size: 18px;
            line-height: 1.6;
            max-width: 500px;
            margin: 15px auto 25px auto;
            padding: 0 15px;
        }

        /* تنسيق الزر التفاعلي */
        .my-button {
            display: block;
            margin: 25px auto;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 6px;
            width: max-content;
            transition: 0.3s;
        }

        /* تأثير الحركة عند إيقاف الماوس على الزر */
        .my-button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>أهلاً بك في موقعي الأول على GitHub!</h1>

    <!-- صورة رمزية توضيحية -->
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="profile-img">

    <!-- النص التعريفي مع اسمك -->
    <p class="bio-text">
        مرحباً! أنا زياد حمادة، مطور مواقع مبتدئ شغوف بتعلم البرمجة وتصميم الصفحات التفاعلية باستخدام HTML و CSS.
    </p>

    <!-- الزر التفاعلي مرتبط بحسابك -->
    <a href="https://github.com/zeaydhamada702-cloud" target="_blank" class="my-button">تصفح حسابي</a>

</body>
</html>

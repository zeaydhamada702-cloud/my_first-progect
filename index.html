<!DOCTYPE html>
<html>
<head>
    <title>زياد حمادة - Portfolio</title>
    <style>
        /* خلفية الصفحة ونوع الخط */
        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            padding-bottom: 50px;
        }

        /* تنسيق العنوان الرئيسي */
        h1 {
            color: #2c3e50;
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            font-size: 28px;
        }

        /* العناوين الفرعية */
        h2 {
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* تنسيق الصورة الدائرية */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 20px auto;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        /* تنسيق النص التعريفي */
        .bio-text {
            color: #555555;
            font-size: 18px;
            line-height: 1.6;
            max-width: 500px;
            margin: 15px auto 25px auto;
            padding: 0 15px;
        }

        /* تنسيق الزر التفاعلي */
        .my-button {
            display: block;
            margin: 25px auto 30px auto;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 6px;
            width: max-content;
            transition: 0.3s;
        }

        .my-button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        /* حاوية كروت المهارات */
        .skills-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* شكل كارت المهارة */
        .skill-card {
            background-color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            font-weight: bold;
            color: #2c3e50;
            border-top: 4px solid #3498db;
        }

        /* قسم التذييل والتواصل */
        footer {
            margin-top: 50px;
            color: #777777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>أهلاً بك في موقعي الأول على GitHub!</h1>

    <!-- صورة رمزية -->
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="profile-img">

    <!-- النص التعريفي -->
    <p class="bio-text">
        مرحباً! أنا زياد حمادة، مطور مواقع مبتدئ شغوف بتعلم البرمجة وتصميم الصفحات التفاعلية باستخدام HTML و CSS.
    </p>

    <!-- الزر التفاعلي -->
    <a href="https://github.com/zeaydhamada702-cloud" target="_blank" class="my-button">تصفح حسابي</a>

    <!-- عنوان المهارات -->
    <h2>المهارات البرمجية</h2>

    <!-- قسم المهارات -->
    <div class="skills-container">
        <div class="skill-card">HTML5</div>
        <div class="skill-card">CSS3</div>
        <div class="skill-card">Git & GitHub</div>
        <div class="skill-card">Web Design</div>
    </div>

    <!-- التذييل -->
    <footer>
        <p>© 2026 جميع الحقوق محفوظة - زياد حمادة</p>
    </footer>

</body>
</html>
